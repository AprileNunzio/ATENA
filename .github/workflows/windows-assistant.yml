name: Windows Assistant

on:
  push:
    branches: [main]
    paths:
      - "client_satellite/windows_assistant/**"
      - ".github/workflows/windows-assistant.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assistant:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client_satellite/windows_assistant
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: client_satellite/windows_assistant/requirements-dev.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Client Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path settings\paths.py -Pattern '^VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          "value=$version" >> $env:GITHUB_OUTPUT
          gh release view "assistant-v$version" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Install Inno Setup
        if: steps.version.outputs.exists == 'false'
        run: choco install innosetup -y --no-progress

      - name: Build Installer
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          ATENA_ASSISTANT_SIGNING_KEY: ${{ secrets.ATENA_ASSISTANT_SIGNING_KEY }}
        run: .\packaging\build.ps1

      - name: Publish Release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $files = @("build\installer\ATENA_Assistente_Setup.exe", "build\installer\manifest.json")
          if (Test-Path "build\installer\manifest.sig") { $files += "build\installer\manifest.sig" }
          gh release create "assistant-v$version" @files --title "ATENA Assistente $version" `
            --notes "Installer dell'Assistente ATENA per Windows $version. Gli aggiornamenti automatici si installano solo se il manifesto è firmato."
