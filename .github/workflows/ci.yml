name: Atena CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linters
        run: python -m pip install --upgrade pip pyflakes

      - name: Syntax Validation
        run: python -m py_compile $(find server sandbox_broker installer_wizard client_satellite -name "*.py")

      - name: Static Analysis
        run: python -m pyflakes server sandbox_broker installer_wizard client_satellite

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: installer_wizard/backend/requirements.txt

      - name: Install Supervisor Dependencies
        run: python -m pip install -r installer_wizard/backend/requirements.txt -r installer_wizard/features/documents/requirements.txt

      - name: Unit and API Tests
        working-directory: ./installer_wizard
        run: python -m unittest discover -s tests -t . -v

      - name: Firewall Rules Against Real nftables
        working-directory: ./installer_wizard
        run: |
          sudo apt-get install -y -qq nftables
          sudo "$(command -v python)" -m unittest tests.test_firewall_rules tests.test_vpn_config -v

  kernel-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kernel Test Dependencies
        run: python -m pip install httpx==0.28.1 pydantic==2.13.5 pydantic-settings==2.15.0 psutil pyyaml

      - name: Kernel and Sandbox Broker Tests
        run: python -m unittest discover -s server/tests -t . -v

  native-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./native
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal -c clippy,rustfmt && rustup default 1.89.0

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust Tests
        run: |
          cargo test --workspace --locked
          cargo clippy -p atena-egress --all-targets --locked --features test-hooks -- -D warnings
          cargo test -p atena-egress --locked --features test-hooks
          cargo build --release --locked -p atena-egress --features test-hooks

      - name: Build and Install Python Module
        run: |
          python -m pip install --upgrade pip maturin==1.9.6
          maturin build --release --locked --manifest-path crates/atena-native/Cargo.toml --out dist
          python -m pip install dist/atena_native-*.whl
          python -m pip install -r ../installer_wizard/backend/requirements.txt

      - name: Native Parity and Bus Tests
        working-directory: ./installer_wizard
        run: python -m unittest tests.test_bus_router tests.test_atena_bus tests.test_nvr tests.test_language_native -v

      - name: Native Egress Proxy Tests
        working-directory: .
        env:
          ATENA_EGRESS_TEST_BIN: ${{ github.workspace }}/native/target/release/atena-egress
        run: |
          python -m pip install httpx==0.28.1 pydantic==2.13.5 pydantic-settings==2.15.0 psutil pyyaml
          python -m unittest server.tests.test_sandbox_native_egress server.tests.test_sandbox_egress -v

  validate-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript Syntax
        run: for f in $(find installer_wizard -name "*.js"); do node --check "$f"; done

      - name: Shell Syntax
        run: for f in $(find scripts installer_wizard -name "*.sh") scripts/os/atenactl install.sh; do bash -n "$f"; done

  validate-web-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client_web/package-lock.json

      - name: Install and Build Frontend
        working-directory: ./client_web
        run: |
          npm ci
          npm run build
