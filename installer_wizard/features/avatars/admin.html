<section class="tab" id="tab-avatars">
<div class="wk-panel" id="avatars-panel">
    <h2>Ologrammi e Avatar 3D</h2>
    <p>Gestisci i tuoi avatar. Ogni avatar ha una sua cartella dedicata per i file .glb e le animazioni.</p>
    
    <div class="wk-form" style="margin-bottom: 20px;">
        <input type="text" id="avatar-new-name" placeholder="Nome Avatar (es. Atena, Michelle)" />
        <input type="file" id="avatar-new-file" accept=".glb,.fbx" />
        <button class="wk-btn" id="avatar-btn-upload">Crea e Carica File</button>
    </div>
    
    <h3>Avatar installati:</h3>
    <ul id="avatars-list" class="wk-list"></ul>
    <div style="margin-top:20px">
        <button class="wk-btn" id="avatar-btn-reset">Usa l'Ologramma Predefinito</button>
    </div>
</div>
</section>
