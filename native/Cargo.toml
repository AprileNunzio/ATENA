[workspace]
resolver = "3"
members = ["crates/bus-core", "crates/atena-native", "crates/egress", "crates/netguard", "crates/langid"]

[workspace.package]
version = "4.1.18"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
similar_names = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
overflow-checks = true
